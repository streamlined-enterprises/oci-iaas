name: Cloudflare Setup

# ─────────────────────────────────────────────────────────────────────────────
# Run modes:
#
#  1. Standalone  — trigger manually via workflow_dispatch, providing env_name.
#
#  2. Chained     — triggered automatically when "Build OCI VM" completes
#                   successfully.  env_name is recovered from an artifact
#                   uploaded by build-vm.yml (see comment below).
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      env_name:
        description: 'Environment name — must match the prefix used in build-vm.yml (e.g. prod, worker-1)'
        required: true
        default: 'prod'

  workflow_run:
    workflows:
      - 'Build OCI VM'
    types:
      - completed

env:
  OCI_REGION: us-chicago-1
  COMPARTMENT_OCID: ${{ secrets.OCI_COMPARTMENT_OCID }}
  OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING: True
  SUPPRESS_LABEL_WARNING: True

jobs:
  cloudflare-setup:
    runs-on: ubuntu-latest

    # When chained, only proceed if the upstream build succeeded.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')

    steps:
      # ── Resolve env_name ────────────────────────────────────────────────────
      # Standalone : use the workflow_dispatch input directly.
      # Chained    : download the artifact that build-vm.yml uploads.
      #
      # To wire env_name from build-vm.yml (chained mode), add these two steps
      # near the END of build-vm.yml's job (before its Summary step):
      #
      #   - name: Export env_name artifact
      #     run: echo "${{ inputs.env_name }}" > env_name.txt
      #   - uses: actions/upload-artifact@v4
      #     with:
      #       name: build-vm-env-name
      #       path: env_name.txt
      #
      # Without the artifact, chained mode falls back to 'prod'.
      # ────────────────────────────────────────────────────────────────────────

      - name: Resolve env_name (standalone)
        id: env
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ENV_NAME="${{ inputs.env_name }}"
          else
            ENV_NAME="prod"
          fi
          echo "name=${ENV_NAME}" >> $GITHUB_OUTPUT
          echo "Mode: ${{ github.event_name }}, env_name=${ENV_NAME}"

      - name: Download env_name artifact (chained mode)
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: build-vm-env-name
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
        continue-on-error: true

      - name: Override env_name from artifact (chained mode)
        if: github.event_name == 'workflow_run'
        id: env_override
        run: |
          if [ -f env_name.txt ]; then
            ENV_NAME=$(tr -d '[:space:]' < env_name.txt)
            echo "Resolved from artifact: ${ENV_NAME}"
          else
            ENV_NAME="${{ steps.env.outputs.name }}"
            echo "Artifact not found, using default: ${ENV_NAME}"
          fi
          echo "name=${ENV_NAME}" >> $GITHUB_OUTPUT

      - name: Set final env_name
        id: resolved_env
        run: |
          NAME="${{ steps.env_override.outputs.name || steps.env.outputs.name }}"
          echo "name=${NAME}" >> $GITHUB_OUTPUT
          echo "Final env_name: ${NAME}"

      # ── OCI CLI ─────────────────────────────────────────────────────────────

      - name: Install OCI CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/oracle/oci-cli/master/scripts/install/install.sh -o install.sh
          bash install.sh --accept-all-defaults
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Configure OCI CLI
        env:
          OCI_USER: ${{ secrets.OCI_USER_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_TENANCY: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_KEY: ${{ secrets.OCI_API_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.oci
          echo "$OCI_KEY" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem
          printf '[DEFAULT]\nuser=%s\nfingerprint=%s\ntenancy=%s\nregion=%s\nkey_file=/home/runner/.oci/oci_api_key.pem\n' \
            "$OCI_USER" "$OCI_FINGERPRINT" "$OCI_TENANCY" "$OCI_REGION" > ~/.oci/config
          chmod 600 ~/.oci/config

      # ── Discover VM public IP ────────────────────────────────────────────────

      - name: Get VM public IP from OCI
        id: vm
        run: |
          ENV_NAME="${{ steps.resolved_env.outputs.name }}"
          PIP_NAME="${ENV_NAME}-reserved-ip"

          PUBLIC_IP=$(oci network public-ip list \
            --compartment-id "$COMPARTMENT_OCID" \
            --scope REGION \
            --query "data[?\"display-name\"=='${PIP_NAME}'] | [0].\"ip-address\"" \
            --raw-output 2>/dev/null || true)

          if [ -z "$PUBLIC_IP" ] || [ "$PUBLIC_IP" = "null" ]; then
            echo "ERROR: Could not find reserved IP named '${PIP_NAME}'."
            exit 1
          fi

          echo "Found public IP: ${PUBLIC_IP}"
          echo "ip=${PUBLIC_IP}" >> $GITHUB_OUTPUT

      # ── SSH setup ───────────────────────────────────────────────────────────

      - name: Write SSH private key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_oci
          chmod 600 ~/.ssh/id_oci
          ssh-keyscan -H "${{ steps.vm.outputs.ip }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Wait for SSH to be ready
        run: |
          IP="${{ steps.vm.outputs.ip }}"
          for i in $(seq 1 12); do
            if ssh -i ~/.ssh/id_oci -o StrictHostKeyChecking=no -o ConnectTimeout=10 \
                 opc@"$IP" 'echo ok' 2>/dev/null; then
              echo "SSH is ready."
              break
            fi
            echo "Attempt $i/12 failed, retrying in 10s..."
            sleep 10
          done

      # ── Install cloudflared ─────────────────────────────────────────────────
      # Remote scripts are base64-encoded so the YAML file contains only
      # properly-indented lines.  The runner decodes them at runtime.
      #
      # Cloudflare does not publish an RPM for aarch64.  The script detects
      # the CPU architecture and uses:
      #   x86_64  — Cloudflare's official dnf/RPM repo
      #   aarch64 — direct binary download from GitHub releases (latest tag)

      - name: Install cloudflared on VM
        run: |
          IP="${{ steps.vm.outputs.ip }}"

          # Decoded script:
          #   set -euo pipefail
          #   ARCH=$(uname -m)
          #   if command -v cloudflared &>/dev/null; then exit 0; fi
          #   if [ "$ARCH" = "x86_64" ]; then
          #     curl -fsSL https://pkg.cloudflare.com/cloudflared.repo \
          #       | sudo tee /etc/yum.repos.d/cloudflared.repo > /dev/null
          #     sudo dnf install -y cloudflared
          #   else
          #     LATEST=$(curl gh api ...)
          #     curl .../cloudflared-linux-arm64 | sudo install to /usr/local/bin
          #   fi
          SCRIPT_B64=""

          echo "$SCRIPT_B64" | base64 -d | \
            ssh -i ~/.ssh/id_oci -o StrictHostKeyChecking=no opc@"$IP" 'bash -s'

      # ── Register tunnel + enable service (single atomic step) ────────────────
      # Token is passed as $1 to the remote script — never embedded in the
      # script body — so it stays out of remote shell history.
      #
      # Decoded script:
      #   CF_TOKEN="$1"
      #   sudo cloudflared service install "$CF_TOKEN"   # creates the unit file
      #   wait loop until unit file appears (up to 20s)
      #   sudo systemctl daemon-reload
      #   sudo systemctl enable cloudflared
      #   sudo systemctl restart cloudflared
      #   verify STATUS == active

      - name: Register and enable cloudflared service
        env:
          CF_TUNNEL_TOKEN: ${{ secrets.CF_TUNNEL_TOKEN }}
        run: |
          IP="${{ steps.vm.outputs.ip }}"

          SCRIPT_B64=""

          echo "$SCRIPT_B64" | base64 -d | \
            ssh -i ~/.ssh/id_oci -o StrictHostKeyChecking=no opc@"$IP" \
            'bash -s' -- "${CF_TUNNEL_TOKEN}"

      # ── Summary ─────────────────────────────────────────────────────────────

      - name: Summary
        run: |
          ENV_NAME="${{ steps.resolved_env.outputs.name }}"
          echo "## Cloudflare Setup Complete — ${ENV_NAME}" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Environment** | ${ENV_NAME} |" >> $GITHUB_STEP_SUMMARY
          echo "| **VM IP** | ${{ steps.vm.outputs.ip }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **cloudflared** | installed + enabled as systemd service |" >> $GITHUB_STEP_SUMMARY
          echo "| **Tunnel token** | from \`CF_TUNNEL_TOKEN\` secret |" >> $GITHUB_STEP_SUMMARY
